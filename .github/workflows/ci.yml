name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Re-evaluate locked dependencies and production images even when source is unchanged.
  schedule:
    - cron: "23 8 * * 1"

# CI only needs to read the repository. Individual actions are pinned to immutable commits.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4.10@sha256:c592c15aaf4a1961e15d82eb31ea5987dda862d1c4b1e93424438c0e91dc1f8d
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: appdb
          MYSQL_USER: appuser
          MYSQL_PASSWORD: apppass
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -uroot -proot --silent"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: local
      COOKIE_SECURE: "false"
      DATABASE_URL: mysql+pymysql://appuser:apppass@127.0.0.1:3306/appdb?charset=utf8mb4
      MYSQL_ROOT_PASSWORD: root
      SESSION_JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      TEST_DATABASE_DESTRUCTIVE_ACK: kingfisher-ephemeral-test-db
      TEST_DATABASE_URL: mysql+pymysql://appuser:apppass@127.0.0.1:3306/appdb_test_database?charset=utf8mb4
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install hash-locked backend toolchain
        run: python -m pip install --require-hashes -r backend/requirements-dev.lock

      - name: Verify dependency locks are reproducible
        working-directory: backend
        run: |
          python -c "from importlib.metadata import version; assert version('pip-tools') == '7.6.0'"
          pip-compile --generate-hashes --no-strip-extras --output-file=requirements.lock requirements.txt
          pip-compile --allow-unsafe --generate-hashes --no-strip-extras --output-file=requirements-dev.lock requirements-dev.txt requirements.txt
          git diff --exit-code -- requirements.lock requirements-dev.lock

      - name: Ruff lint and format
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy static analysis
        working-directory: backend
        run: mypy app

      - name: Bandit security analysis
        working-directory: backend
        run: bandit -q -r app -ll -ii

      - name: Audit the complete locked Python dependency graphs
        working-directory: backend
        run: |
          python -m pip_audit --require-hashes -r requirements.lock
          python -m pip_audit --require-hashes -r requirements-dev.lock

      - name: Verify migration topology, upgrade, and model drift
        working-directory: backend
        run: |
          test "$(alembic heads | wc -l)" -eq 1
          alembic upgrade head
          alembic check

      - name: Test with branch coverage gate
        working-directory: backend
        run: pytest --cov=app --cov-branch --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage-${{ github.sha }}
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Production bundle
        working-directory: frontend
        run: npm run build

      - name: Audit the complete frontend dependency graph
        working-directory: frontend
        run: npm audit --audit-level=high

  supply-chain:
    name: Production images and supply chain
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Build production images
        run: |
          docker build --target prod -t kingfisher-api:ci-${{ github.sha }} ./backend
          docker build --target prod -t kingfisher-web:ci-${{ github.sha }} ./frontend

      - name: Smoke the exact production images
        shell: bash
        run: |
          set -Eeuo pipefail
          api_container="kingfisher-api-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          web_container="kingfisher-web-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            docker rm --force "$api_container" "$web_container" >/dev/null 2>&1 || true
          }
          on_exit() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs "$api_container" 2>&1 || true
              docker logs "$web_container" 2>&1 || true
            fi
            cleanup
            exit "$status"
          }
          trap on_exit EXIT
          cleanup

          api_image="kingfisher-api:ci-${GITHUB_SHA}"
          web_image="kingfisher-web:ci-${GITHUB_SHA}"
          test "$(docker image inspect --format '{{.Config.User}}' "$api_image")" = "65532:65532"

          session_secret="$(openssl rand -hex 32)"
          docker run --detach --name "$api_container" \
            --publish 127.0.0.1::8000 \
            --env APP_ENV=production \
            --env DATABASE_URL='mysql+pymysql://ci:ci@db.invalid:3306/appdb?charset=utf8mb4' \
            --env DB_REQUIRE_TLS=true \
            --env SESSION_JWT_SECRET="$session_secret" \
            --env PUBLIC_ORIGIN=https://ci.kingfisher.invalid \
            --env GOOGLE_CLIENT_ID=123456-testclient.apps.googleusercontent.com \
            --env ALLOWED_EMAIL_DOMAINS=kingfisher.invalid \
            "$api_image"
          api_port="$(docker port "$api_container" 8000/tcp | sed -E 's/.*:([0-9]+)$/\1/')"
          test -n "$api_port"

          for _ in $(seq 1 40); do
            if curl --fail --silent --show-error "http://127.0.0.1:${api_port}/api/health/live" >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error "http://127.0.0.1:${api_port}/api/health/live" \
            | grep --fixed-strings '"status":"alive"' >/dev/null
          docker exec "$api_container" python -c \
            "import os; assert (os.geteuid(), os.getegid()) == (65532, 65532)"

          docker run --detach --name "$web_container" \
            --publish 127.0.0.1::80 \
            "$web_image"
          web_port="$(docker port "$web_container" 80/tcp | sed -E 's/.*:([0-9]+)$/\1/')"
          test -n "$web_port"

          for _ in $(seq 1 40); do
            if curl --fail --silent --show-error "http://127.0.0.1:${web_port}/" >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error "http://127.0.0.1:${web_port}/" \
            | grep --ignore-case --fixed-strings '<!doctype html>' >/dev/null

      - name: Scan API image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kingfisher-api:ci-${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: "false"
          exit-code: "1"
          hide-progress: "true"
          timeout: 10m0s
          version: v0.70.0

      - name: Scan web image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kingfisher-web:ci-${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: "false"
          exit-code: "1"
          hide-progress: "true"
          timeout: 10m0s
          version: v0.70.0

      - name: Create SBOM output directory
        run: mkdir -p sbom

      - name: Generate API SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: kingfisher-api:ci-${{ github.sha }}
          format: spdx-json
          output-file: sbom/kingfisher-api.spdx.json
          syft-version: v1.44.0
          dependency-snapshot: "false"
          upload-artifact: "false"
          upload-release-assets: "false"

      - name: Generate web SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: kingfisher-web:ci-${{ github.sha }}
          format: spdx-json
          output-file: sbom/kingfisher-web.spdx.json
          syft-version: v1.44.0
          dependency-snapshot: "false"
          upload-artifact: "false"
          upload-release-assets: "false"

      - name: Validate production SBOMs
        run: |
          test -s sbom/kingfisher-api.spdx.json
          test -s sbom/kingfisher-web.spdx.json

      - name: Upload production SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-image-sboms-${{ github.sha }}
          path: sbom/*.spdx.json
          if-no-files-found: error
          retention-days: 30

  e2e:
    name: End-to-end access control
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Install runner-side dependencies before Compose can create a root-owned node_modules path.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Prepare isolated stack configuration
        run: |
          cp .env.example .env
          session_secret="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          dev_auth_secret="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$session_secret"
          echo "::add-mask::$dev_auth_secret"
          {
            echo "SESSION_JWT_SECRET=$session_secret"
            echo "DEV_AUTH_ENABLED=true"
            echo "DEV_AUTH_SECRET=$dev_auth_secret"
            echo "MYSQL_DATA_VOLUME=kingfisher_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          } >> .env
          {
            echo "E2E_DEV_AUTH_SECRET=$dev_auth_secret"
            echo "E2E_BASE_URL=http://127.0.0.1:5173"
          } >> "$GITHUB_ENV"
          docker compose config --quiet

      - name: Start database and API
        run: docker compose up -d --build mysql api

      - name: Wait for API liveness
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health/live >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health/live

      - name: Apply migrations and seed demo data
        run: |
          docker compose exec -T api alembic upgrade head
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health/ready >/dev/null
          docker compose exec -T api python -m app.scripts.seed_demo

      - name: Start and wait for web
        run: |
          docker compose up -d --build --no-deps web
          for _ in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          curl --fail --silent --show-error http://127.0.0.1:5173 >/dev/null

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-${{ github.sha }}
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down the ephemeral stack
        if: always()
        run: docker compose down -v --remove-orphans
