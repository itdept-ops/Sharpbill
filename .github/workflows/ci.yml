name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Re-evaluate centrally pinned dependencies and production images even when source is unchanged.
  schedule:
    - cron: "23 8 * * 1"

# CI only needs to read the repository. Individual actions are pinned to immutable commits.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4.10@sha256:c592c15aaf4a1961e15d82eb31ea5987dda862d1c4b1e93424438c0e91dc1f8d
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: appdb
          MYSQL_USER: appuser
          MYSQL_PASSWORD: apppass
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -uroot -proot --silent"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: local
      ASPNETCORE_ENVIRONMENT: Development
      COOKIE_SECURE: "false"
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppass
      DB_REQUIRE_TLS: "false"
      SHARPBILL_TEST_DATABASE: "Server=127.0.0.1;Port=3306;Database=appdb;User ID=appuser;Password=apppass;SslMode=Disabled;AllowPublicKeyRetrieval=True"
      SESSION_JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      TEST_DATABASE_DESTRUCTIVE_ACK: sharpbill-ephemeral-test-db
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json

      - name: Restore and audit NuGet dependencies
        working-directory: backend
        run: dotnet restore Sharpbill.slnx --nologo --force-evaluate

      - name: Reject vulnerable transitive packages
        working-directory: backend
        run: |
          dotnet package list \
            --project Sharpbill.slnx \
            --vulnerable \
            --include-transitive \
            --format json \
            --no-restore > vulnerable-packages.json
          jq -e '[
            .projects[]
            | .frameworks[]?
            | (.topLevelPackages[]?, .transitivePackages[]?)
            | select(((.vulnerabilities // []) | length) > 0)
          ] | length == 0' vulnerable-packages.json

      - name: Verify formatting and analyzers
        working-directory: backend
        run: dotnet format Sharpbill.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Build Release artifacts
        working-directory: backend
        run: dotnet build Sharpbill.slnx --configuration Release --no-restore --nologo

      - name: Verify migration dry-run, apply, and schema journal
        working-directory: backend
        run: |
          dotnet run --project src/Sharpbill.Migrator --configuration Release --no-build -- migrate --dry-run
          dotnet run --project src/Sharpbill.Migrator --configuration Release --no-build -- migrate
          dotnet run --project src/Sharpbill.Migrator --configuration Release --no-build -- validate

      - name: Test with coverage
        working-directory: backend
        run: |
          dotnet test Sharpbill.slnx \
            --configuration Release \
            --no-build \
            --nologo \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults \
            --logger "trx;LogFilePrefix=sharpbill"

          mapfile -d '' result_files < <(find TestResults -type f -name '*.trx' -print0)
          test "${#result_files[@]}" -gt 0
          for result_file in "${result_files[@]}"; do
            if grep --quiet '<Counters total="0"' "$result_file"; then
              echo "No tests were discovered in $result_file" >&2
              exit 1
            fi
          done

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage-${{ github.sha }}
          path: |
            backend/TestResults/**/*.trx
            backend/TestResults/**/coverage.cobertura.xml
            backend/vulnerable-packages.json
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Production bundle
        working-directory: frontend
        run: npm run build

      - name: Audit the complete frontend dependency graph
        working-directory: frontend
        run: npm audit --audit-level=high

  supply-chain:
    name: Production images and supply chain
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Scan source for secrets and high-risk misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          hide-progress: "true"
          skip-dirs: .git
          timeout: 10m0s
          version: v0.70.0

      - name: Build production images
        run: |
          docker build --target prod -t sharpbill-api:ci-${{ github.sha }} ./backend
          docker build --target prod -t sharpbill-web:ci-${{ github.sha }} ./frontend

      - name: Smoke the exact production images
        shell: bash
        run: |
          set -Eeuo pipefail
          api_container="sharpbill-api-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          web_container="sharpbill-web-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            docker rm --force "$api_container" "$web_container" >/dev/null 2>&1 || true
          }
          on_exit() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs "$api_container" 2>&1 || true
              docker logs "$web_container" 2>&1 || true
            fi
            cleanup
            exit "$status"
          }
          trap on_exit EXIT
          cleanup

          api_image="sharpbill-api:ci-${GITHUB_SHA}"
          web_image="sharpbill-web:ci-${GITHUB_SHA}"
          test "$(docker image inspect --format '{{.Config.User}}' "$api_image")" = "65532:65532"
          test "$(docker image inspect --format '{{.Config.User}}' "$web_image")" = "101:101"

          session_secret="$(openssl rand -hex 32)"
          docker run --detach --name "$api_container" \
            --publish 127.0.0.1::8000 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 \
            --cap-drop ALL \
            --pids-limit 256 \
            --security-opt no-new-privileges \
            --env APP_ENV=production \
            --env ASPNETCORE_ENVIRONMENT=Production \
            --env DB_HOST=db.invalid \
            --env DB_PORT=3306 \
            --env DB_NAME=appdb \
            --env DB_USER=ci \
            --env DB_PASSWORD=ci \
            --env DB_REQUIRE_TLS=true \
            --env DB_TLS_CA_PATH=/opt/sharpbill/certs/rds-global-bundle.pem \
            --env SESSION_JWT_SECRET="$session_secret" \
            --env PUBLIC_ORIGIN=https://ci.sharpbill.invalid \
            --env GOOGLE_CLIENT_ID=123456-testclient.apps.googleusercontent.com \
            "$api_image"
          api_port="$(docker port "$api_container" 8000/tcp | sed -E 's/.*:([0-9]+)$/\1/')"
          test -n "$api_port"

          for _ in $(seq 1 40); do
            if curl --fail --silent --show-error "http://127.0.0.1:${api_port}/api/health/live" >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error "http://127.0.0.1:${api_port}/api/health/live" \
            | grep --fixed-strings '"status":"alive"' >/dev/null

          docker run --detach --name "$web_container" \
            --publish 127.0.0.1::80 \
            "$web_image"
          web_port="$(docker port "$web_container" 80/tcp | sed -E 's/.*:([0-9]+)$/\1/')"
          test -n "$web_port"

          for _ in $(seq 1 40); do
            if curl --fail --silent --show-error "http://127.0.0.1:${web_port}/" >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error "http://127.0.0.1:${web_port}/" \
            | grep --ignore-case --fixed-strings '<!doctype html>' >/dev/null

      - name: Scan API image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sharpbill-api:ci-${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: "false"
          exit-code: "1"
          hide-progress: "true"
          timeout: 10m0s
          version: v0.70.0

      - name: Scan web image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sharpbill-web:ci-${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: "false"
          exit-code: "1"
          hide-progress: "true"
          timeout: 10m0s
          version: v0.70.0

      - name: Create SBOM output directory
        run: mkdir -p sbom

      - name: Generate API SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: sharpbill-api:ci-${{ github.sha }}
          format: spdx-json
          output-file: sbom/sharpbill-api.spdx.json
          syft-version: v1.44.0
          dependency-snapshot: "false"
          upload-artifact: "false"
          upload-release-assets: "false"

      - name: Generate web SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: sharpbill-web:ci-${{ github.sha }}
          format: spdx-json
          output-file: sbom/sharpbill-web.spdx.json
          syft-version: v1.44.0
          dependency-snapshot: "false"
          upload-artifact: "false"
          upload-release-assets: "false"

      - name: Validate production SBOMs
        run: |
          test -s sbom/sharpbill-api.spdx.json
          test -s sbom/sharpbill-web.spdx.json

      - name: Upload production SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-image-sboms-${{ github.sha }}
          path: sbom/*.spdx.json
          if-no-files-found: error
          retention-days: 30

  e2e:
    name: End-to-end access control
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Install runner-side dependencies before Compose can create a root-owned node_modules path.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Prepare isolated stack configuration
        run: |
          cp .env.example .env
          session_secret="$(openssl rand -hex 32)"
          dev_auth_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$session_secret"
          echo "::add-mask::$dev_auth_secret"
          {
            echo "SESSION_JWT_SECRET=$session_secret"
            echo "DEV_AUTH_ENABLED=true"
            echo "DEV_AUTH_SECRET=$dev_auth_secret"
            echo "MYSQL_DATA_VOLUME=sharpbill_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          } >> .env
          {
            echo "E2E_DEV_AUTH_SECRET=$dev_auth_secret"
            echo "E2E_BASE_URL=http://127.0.0.1:5173"
          } >> "$GITHUB_ENV"
          docker compose config --quiet

      - name: Start database
        run: docker compose up -d mysql

      - name: Apply migrations and seed demo data
        run: |
          docker compose run --rm migrator migrate
          docker compose run --rm migrator seed-demo

      - name: Start API
        run: docker compose up -d --build api

      - name: Wait for API liveness and readiness
        run: |
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health/live >/dev/null; then
              break
            fi
            sleep 3
          done
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health/live
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health/ready >/dev/null

      - name: Start and wait for web
        run: |
          docker compose up -d --build --no-deps web
          for _ in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          curl --fail --silent --show-error http://127.0.0.1:5173 >/dev/null

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-${{ github.sha }}
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down the ephemeral stack
        if: always()
        run: docker compose down -v --remove-orphans
