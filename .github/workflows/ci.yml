name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: appdb
          MYSQL_USER: appuser
          MYSQL_PASSWORD: apppass
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -uroot -proot --silent"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: mysql+pymysql://appuser:apppass@127.0.0.1:3306/appdb?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://appuser:apppass@127.0.0.1:3306/appdb_test?charset=utf8mb4
      MYSQL_ROOT_PASSWORD: root
      SESSION_JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      APP_ENV: local
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4

      # ---- backend ----
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: ruff check . && ruff format --check .
      - name: Migration smoke test (single head + upgrade)
        working-directory: backend
        run: |
          test "$(alembic heads | wc -l)" -eq 1
          alembic upgrade head
      - name: Tests
        working-directory: backend
        run: pytest

      # ---- frontend ----
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    # End-to-end: boot the real stack (Vite + FastAPI + MySQL) with Docker Compose and drive it in a
    # browser via the local-only dev-login, proving sign-in + per-request RBAC work together.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install runner-side deps FIRST — before `docker compose up`, which would otherwise create a
      # root-owned frontend/node_modules mountpoint that blocks `npm ci`.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Prepare .env for the stack
        run: |
          cp .env.example .env
          {
            echo "SESSION_JWT_SECRET=$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
            echo "DEV_AUTH_ENABLED=true"
          } >> .env

      - name: Build & start the stack
        run: docker compose up -d --build

      - name: Wait for API and web
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8000/api/health >/dev/null && break; sleep 3; done
          curl -sf http://localhost:8000/api/health
          for i in $(seq 1 40); do curl -sf http://localhost:5173 >/dev/null && break; sleep 3; done
          curl -sf http://localhost:5173 >/dev/null

      - name: Apply migrations + seed demo data
        run: |
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api python -m app.scripts.seed_demo

      - name: Run E2E
        run: npx playwright test
        working-directory: frontend

      - name: Stack logs (on failure)
        if: failure()
        run: docker compose logs --tail 200
