server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # --- Security response headers (applied to every response; the location block below adds no
  # add_header of its own, so it inherits these). TLS/HSTS is terminated at the edge (out of scope
  # here), so HSTS is intentionally left to the edge proxy. The CSP allowlists Google Identity
  # Services (the login button loads https://accounts.google.com/gsi/client). 'unsafe-inline' for
  # styles is required because the SPA uses inline style={...} + CSS variables.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: https:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location / {
    try_files $uri /index.html;
  }
}
