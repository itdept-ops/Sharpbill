[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]
ignore = ["B008"]  # FastAPI uses function calls (Depends()) in argument defaults

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead[.]:starlette.exceptions.StarletteDeprecationWarning:fastapi.testclient",
    "ignore:Exception ignored in.*reverse_geocoder/rg_cities1000[.]csv.*:pytest.PytestUnraisableExceptionWarning",
]
testpaths = ["tests"]
pythonpath = ["."]
xfail_strict = true

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
pretty = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
